    <div>
<div class="slider">

    <img id="sliderImage" src="./images/home/image1.jpeg" alt="Image">

    <div class="dots">
        <span onclick="showImage(0)">●</span>
        <span onclick="showImage(1)">●</span>
        <span onclick="showImage(2)">●</span>
        <span onclick="showImage(3)">●</span>

    </div>

</div>

<script>
    let images = [
        "../images/home/image1.jpeg",
        "./images/home/image2.jpeg",
        "./images/home/image3.jpeg",
        "./images/home/image4.jpeg",
    ];

    let current = 0;

    function showImage(index) {
        current = index;
        document.getElementById("sliderImage").src = images[current];
    }

    setInterval(function () {
        current++;

        if (current >= images.length) {
            current = 0;
        }

        showImage(current);
    }, 3000);
</script>
</div>
